<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .booking-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 2rem 2rem 2rem 2rem;
            border: 1px solid rgba(255, 215, 100, 0.15);
            transition: all 0.3s;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f5e7c6;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
            border-bottom: 2px solid rgba(255, 215, 100, 0.3);
            padding-bottom: 1rem;
        }

        h1 i {
            color: #f5c542;
            font-size: 2.2rem;
            text-shadow: 0 0 15px rgba(245, 197, 66, 0.5);
        }

        .subhead {
            color: #a8b3cf;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .movie-selector {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .movie-badge {
            background: #232a3b;
            color: #cdd9f0;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #3c465e;
            transition: 0.2s;
            cursor: default;
        }

        .movie-badge.active {
            background: #f5c542;
            color: #0b0f1c;
            border-color: #f5c542;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(245, 197, 66, 0.4);
        }

        .screen-section {
            margin-bottom: 2.2rem;
            perspective: 400px;
        }

        .screen {
            background: linear-gradient(135deg, #d4d9e6, #a3adc2);
            height: 30px;
            width: 70%;
            margin: 0 auto 10px;
            border-radius: 50% 50% 10% 10% / 100% 100% 0 0;
            transform: rotateX(-8deg);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2), 0 0 30px #b0c4de55;
            border-bottom: 3px solid #f5c542;
        }

        .screen-label {
            text-align: center;
            color: #a8b3cf;
            font-size: 0.85rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .seat-map {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0 1.5rem;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .seat {
            width: 45px;
            height: 45px;
            background: #252e40;
            border-radius: 12px 12px 6px 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7788a8;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #3f4b62;
            box-shadow: 0 4px 0 #10131c;
            user-select: none;
            position: relative;
        }

        .seat i {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .seat.available:hover {
            background: #3d4a66;
            color: #eef3ff;
            border-color: #7f8fb0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #10131c;
        }

        .seat.selected {
            background: #f5c542;
            color: #0b0f1c;
            border-color: #ffe28c;
            box-shadow: 0 4px 0 #a07d1a, 0 0 15px #f5c542aa;
        }

        .seat.selected i {
            opacity: 1;
            color: #0b0f1c;
        }

        .seat.occupied {
            background: #1b1f2b;
            color: #3a4358;
            border-color: #2b3247;
            cursor: not-allowed;
            box-shadow: 0 2px 0 #0b0e14;
            opacity: 0.5;
        }

        .seat.occupied i {
            opacity: 0.3;
        }

        .seat.aisle {
            visibility: hidden;
            pointer-events: none;
            box-shadow: none;
            background: transparent;
            border: none;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 1rem;
            flex-wrap: wrap;
            color: #b7c2db;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 22px;
            height: 22px;
            border-radius: 8px 8px 4px 4px;
            background: #252e40;
            border: 1px solid #3f4b62;
            box-shadow: 0 3px 0 #10131c;
        }

        .legend-box.available {
            background: #252e40;
        }

        .legend-box.selected {
            background: #f5c542;
            border-color: #ffe28c;
            box-shadow: 0 3px 0 #a07d1a;
        }

        .legend-box.occupied {
            background: #1b1f2b;
            border-color: #2b3247;
            opacity: 0.6;
            box-shadow: 0 2px 0 #0b0e14;
        }

        .booking-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101520;
            border-radius: 60px;
            padding: 0.9rem 1.5rem 0.9rem 2rem;
            margin-top: 1.8rem;
            border: 1px solid #2b3548;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .summary-details {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d0dbf0;
            font-weight: 500;
        }

        .summary-item i {
            color: #f5c542;
            font-size: 1.1rem;
            width: 1.4rem;
        }

        .price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5e7c6;
            letter-spacing: 1px;
            margin-left: auto;
        }

        .price span {
            font-size: 1rem;
            color: #8f9bb5;
            font-weight: 400;
            margin-right: 5px;
        }

        .book-btn {
            background: #f5c542;
            border: none;
            padding: 0.9rem 2.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #0b0f1c;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 0 #a07d1a, 0 0 15px #f5c54255;
            border: 1px solid #ffe28c;
            letter-spacing: 0.5px;
        }

        .book-btn:hover {
            background: #ffd95c;
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #a07d1a, 0 0 25px #f5c542aa;
        }

        .book-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #a07d1a;
        }

        .book-btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #5a4a1a;
            pointer-events: none;
            background: #b89a3a;
            color: #2e2a1c;
        }

        .notification {
            margin-top: 1.2rem;
            text-align: center;
            color: #b9f5b9;
            font-weight: 500;
            min-height: 2rem;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .notification i {
            color: #7ae07a;
        }

        .row-label {
            display: inline-block;
            width: 25px;
            color: #7a879f;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin-right: 8px;
        }

        @media (max-width: 680px) {
            .booking-container {
                padding: 1.5rem;
            }
            .seat {
                width: 35px;
                height: 35px;
                font-size: 0.65rem;
            }
            .row {
                gap: 0.5rem;
            }
            .legend {
                gap: 1rem;
            }
            .booking-summary {
                flex-direction: column;
                align-items: stretch;
                border-radius: 30px;
                padding: 1.2rem;
            }
            .book-btn {
                justify-content: center;
            }
            .price {
                margin-left: 0;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .seat {
                width: 28px;
                height: 28px;
            }
            .row-label {
                display: none;
            }
            .screen {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h1>
            <i class="fas fa-film"></i> CineMagic
        </h1>
        <div class="subhead">
            <div class="movie-selector">
                <span class="movie-badge active">Dune: Part Two</span>
                <span class="movie-badge">Oppenheimer</span>
                <span class="movie-badge">Barbie</span>
            </div>
            <div><i class="fas fa-clock"></i> 7:30 PM &nbsp;|&nbsp; Hall 3</div>
        </div>

        <div class="screen-section">
            <div class="screen"></div>
            <div class="screen-label">SCREEN</div>
        </div>

        <!-- Seat map dynamically generated via JavaScript -->
        <div class="seat-map" id="seatMap"></div>

        <div class="legend">
            <div class="legend-item"><span class="legend-box available"></span> Available</div>
            <div class="legend-item"><span class="legend-box selected"></span> Selected</div>
            <div class="legend-item"><span class="legend-box occupied"></span> Occupied</div>
        </div>

        <div class="booking-summary">
            <div class="summary-details">
                <div class="summary-item">
                    <i class="fas fa-chair"></i> <span id="selectedCount">0</span> seats
                </div>
                <div class="summary-item">
                    <i class="fas fa-tag"></i> $<span id="selectedTotal">0</span>
                </div>
            </div>
            <div class="price">
                <span>Total</span> $<span id="grandTotal">0</span>
            </div>
            <button class="book-btn" id="bookButton" disabled>
                <i class="fas fa-ticket-alt"></i> Book now
            </button>
        </div>
        <div class="notification" id="notification"></div>
    </div>

    <script>
        (function() {
            // ----- Configuration -----
            const ROWS = 6;                 // A to F (6 rows)
            const SEATS_PER_ROW = 8;        // 8 seats each
            const SEAT_PRICE = 12.50;       // price per ticket
            // Pre-occupied seats (row index, seat index starting from 0)
            const OCCUPIED_SEATS = [
                [1, 2], [1, 5], 
                [2, 1], [2, 7],
                [3, 0], [3, 4], [3, 6],
                [4, 3], [4, 5],
                [5, 0], [5, 7]
            ];

            // ----- State -----
            let seats = [];        // 2D array: true = occupied, false = available
            let selectedSeats = []; // array of strings like "A-3"

            // ----- DOM elements -----
            const seatMapEl = document.getElementById('seatMap');
            const selectedCountEl = document.getElementById('selectedCount');
            const selectedTotalEl = document.getElementById('selectedTotal');
            const grandTotalEl = document.getElementById('grandTotal');
            const bookButton = document.getElementById('bookButton');
            const notificationEl = document.getElementById('notification');

            // ----- Helper: generate seats array -----
            function initSeats() {
                seats = Array.from({ length: ROWS }, () => Array(SEATS_PER_ROW).fill(false));
                // Mark occupied
                OCCUPIED_SEATS.forEach(([r, c]) => {
                    if (r >= 0 && r < ROWS && c >= 0 && c < SEATS_PER_ROW) {
                        seats[r][c] = true;
                    }
                });
            }

            // ----- Helper: row letter from index (0 -> A) -----
            function rowLetter(rowIdx) {
                return String.fromCharCode(65 + rowIdx); // A, B, C...
            }

            // ----- Helper: update summary and button state -----
            function updateSummary() {
                const count = selectedSeats.length;
                const total = count * SEAT_PRICE;
                selectedCountEl.textContent = count;
                selectedTotalEl.textContent = total.toFixed(2);
                grandTotalEl.textContent = total.toFixed(2);
                // Enable/disable book button based on selected seats count
                if (count > 0) {
                    bookButton.disabled = false;
                } else {
                    bookButton.disabled = true;
                }
                // Clear any old notification when selection changes
                notificationEl.innerHTML = '';
            }

            // ----- Helper: render seat map from data & selectedSeats -----
            function renderSeatMap() {
                seatMapEl.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'row';
                    
                    // Add row label (A, B, C...) outside the row for clarity (optional)
                    const rowLabelSpan = document.createElement('span');
                    rowLabelSpan.className = 'row-label';
                    rowLabelSpan.textContent = rowLetter(r);
                    rowDiv.appendChild(rowLabelSpan);

                    for (let c = 0; c < SEATS_PER_ROW; c++) {
                        const seatDiv = document.createElement('div');
                        seatDiv.className = 'seat';
                        const seatId = `${rowLetter(r)}-${c + 1}`; // e.g. A-1
                        const isOccupied = seats[r][c];
                        const isSelected = selectedSeats.includes(seatId);

                        // Add classes
                        if (isOccupied) {
                            seatDiv.classList.add('occupied');
                        } else {
                            seatDiv.classList.add('available');
                        }
                        if (isSelected && !isOccupied) {
                            seatDiv.classList.add('selected');
                        }

                        // Add seat number/icon inside
                        const seatNumber = document.createElement('span');
                        seatNumber.textContent = c + 1;
                        seatNumber.style.fontWeight = '600';
                        seatNumber.style.fontSize = '0.75rem';
                        if (window.innerWidth < 480) {
                            seatNumber.style.fontSize = '0.65rem';
                        }
                        // Alternatively add a small icon on larger screens
                        if (window.innerWidth > 600) {
                            seatNumber.innerHTML = `<i class="fas fa-chair"></i>`;
                        }
                        seatDiv.appendChild(seatNumber);
                        
                        // Add data attributes for click handling
                        seatDiv.dataset.row = r;
                        seatDiv.dataset.col = c;
                        seatDiv.dataset.seatId = seatId;

                        // Add click event only if not occupied
                        if (!isOccupied) {
                            seatDiv.addEventListener('click', onSeatClick);
                        }

                        rowDiv.appendChild(seatDiv);
                    }

                    // Optional: add right side row label (symmetry)
                    const rowLabelRight = document.createElement('span');
                    rowLabelRight.className = 'row-label';
                    rowLabelRight.textContent = rowLetter(r);
                    rowLabelRight.style.marginLeft = '8px';
                    rowLabelRight.style.marginRight = '0';
                    rowLabelRight.style.opacity = '0.5';
                    rowDiv.appendChild(rowLabelRight);

                    seatMapEl.appendChild(rowDiv);
                }
                updateSummary();
            }

            // ----- Event handler: seat click -----
            function onSeatClick(event) {
                const seatDiv = event.currentTarget;
                const row = parseInt(seatDiv.dataset.row, 10);
                const col = parseInt(seatDiv.dataset.col, 10);
                const seatId = seatDiv.dataset.seatId;

                // Double-check not occupied (safety)
                if (seats[row][col]) return;

                // Toggle selection
                if (selectedSeats.includes(seatId)) {
                    // Deselect
                    selectedSeats = selectedSeats.filter(id => id !== seatId);
                } else {
                    // Select (maybe limit to 8 seats max? not needed but nice)
                    if (selectedSeats.length >= 8) {
                        notificationEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Maximum 8 seats per booking';
                        setTimeout(() => { notificationEl.innerHTML = ''; }, 2000);
                        return;
                    }
                    selectedSeats.push(seatId);
                }

                // Re-render entire map (simplest, keeps in sync)
                renderSeatMap();
            }

            // ----- Reset selection after booking (optional) -----
            function resetSelection() {
                selectedSeats = [];
                // Mark all selected seats as now occupied in the seats matrix? 
                // For realistic demo we make them occupied.
                // But we need to keep original occupied seats. So we set those seats to true.
                // Let's make the selected seats permanently occupied for this session.
                selectedSeats.forEach(seatId => {
                    const [rowLetterPart, colPart] = seatId.split('-');
                    const rowIdx = rowLetterPart.charCodeAt(0) - 65; // A->0
                    const colIdx = parseInt(colPart, 10) - 1;
                    if (rowIdx >= 0 && rowIdx < ROWS && colIdx >= 0 && colIdx < SEATS_PER_ROW) {
                        seats[rowIdx][colIdx] = true; // now occupied
                    }
                });
                selectedSeats = [];
                renderSeatMap();
            }

            // ----- Book button handler -----
            function handleBook() {
                if (selectedSeats.length === 0) return;

                // Generate a booking message
                const seatList = selectedSeats.join(', ');
                const total = (selectedSeats.length * SEAT_PRICE).toFixed(2);
                
                // Show success notification
                notificationEl.innerHTML = `<i class="fas fa-check-circle"></i> Booked ${selectedSeats.length} seat(s) for $${total}. Seats: ${seatList}`;
                
                // Disable the button temporarily (avoid double booking)
                bookButton.disabled = true;

                // Mark seats as occupied and clear selection after a short delay
                setTimeout(() => {
                    resetSelection();
                    // Re-enable button will be handled by updateSummary after render (since no seats selected)
                }, 400);

                // But we also need to reset the button state visually; renderSeatMap calls updateSummary which disables button.
                // However we call resetSelection inside timeout; we want immediate feedback.
                // Let's call resetSelection after a very short delay so the user sees the click feedback.
                // Actually resetSelection will re-render and button will be disabled.
                // We'll also clear notification after a while.
                setTimeout(() => {
                    notificationEl.innerHTML = ''; // clear after 3 sec
                }, 3000);
            }

            // ----- Initial render -----
            function init() {
                initSeats();
                renderSeatMap();

                // Attach book button event
                bookButton.addEventListener('click', handleBook);

                // Make legend interactive? not needed

                // On window resize, we might want to re-render to change seat icon (optional)
                window.addEventListener('resize', () => {
                    // A small debounce
                    clearTimeout(window.resizeTimer);
                    window.resizeTimer = setTimeout(() => {
                        renderSeatMap(); // re-render for icon style changes
                    }, 200);
                });
            }

            // Start the app
            init();
        })();
    </script>
</body>
</html>
